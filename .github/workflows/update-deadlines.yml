name: Update ML deadlines and funding

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update conference submission deadlines
        run: python scripts/update_deadlines.py

      - name: Update verified funding deadlines
        run: python scripts/update_funding_programs.py

      - name: Discover new official funding pages
        run: python scripts/discover_funding.py

      - name: Commit data changes
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update ML deadlines and funding tracker"
          git push
